[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolspec"
version = "1.6.2"
description = "Small Python toolkit for implementing ToolHub tools with Pydantic contracts."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolspec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
